name: Backend CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Step 3: Give permission to Maven wrapper
      - name: Make mvnw executable
        run: chmod +x mvnw

      # Step 4: Run tests
      - name: Run Tests
        run: ./mvnw clean test